{% extends "base.html" %}{% block title %}Edit Profile — Majestic Market{% endblock %}
{% block content %}
<div class="container" style="padding-top:3rem;padding-bottom:4rem;max-width:600px;">
  <div class="mb-4">
    <h1 class="sec-title">Edit <span class="acc">Profile</span></h1>
    <div class="sec-line"></div>
  </div>
  <div class="glass-card p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled/>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
        <input type="text" class="form-control" value="{{ user.email }}" disabled/>
      </div>
      <div class="mb-4">
        <label class="form-label d-flex justify-content-between">
          <span><i class="bi bi-chat-text me-1"></i>Bio</span>
          <span class="form-text"><span id="descCount">{{ user.bio|length if user.bio else 0 }}</span>/300</span>
        </label>
        <textarea name="bio" id="descriptionField" class="form-control" rows="3" maxlength="300" placeholder="Tell buyers a little about yourself…">{{ user.bio or '' }}</textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-gold"><i class="bi bi-check-circle me-2"></i>Save Changes</button>
        <a href="{{ url_for('profile',uid=user.id) }}" class="btn btn-glass">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
