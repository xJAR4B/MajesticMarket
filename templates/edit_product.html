{% extends "base.html" %}{% block title %}Edit Listing — Majestic Market{% endblock %}
{% block content %}
<div class="container" style="padding-top:3rem;padding-bottom:4rem;max-width:800px;">
  <div class="mb-4">
    <span class="sec-label">Manage Listing</span>
    <h1 class="sec-title">Edit <span class="acc">Product</span></h1>
    <div class="sec-line"></div>
  </div>
  <div class="glass-card p-4">
    <form method="post" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label"><i class="bi bi-tag me-1"></i>Title *</label>
          <input type="text" name="title" class="form-control" value="{{ p.title }}" required maxlength="120"/>
        </div>
        <div class="col-md-4">
          <label class="form-label"><i class="bi bi-grid me-1"></i>Category</label>
          <select name="category_id" class="form-select">
            {% for c in categories %}<option value="{{ c.id }}" {% if c.id==p.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label"><i class="bi bi-currency-yen me-1"></i>Price (¥)</label>
          <input type="number" name="price" class="form-control price-input" value="{{ '%.2f'|format(p.price) }}" step="0.01" min="0"/>
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="bi bi-star me-1"></i>Condition</label>
          <select name="condition" class="form-select">
            {% for c in ['Like New','Good','Fair'] %}
            <option value="{{ c }}" {% if p.condition==c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label"><i class="bi bi-toggle-on me-1"></i>Status</label>
          <select name="status" class="form-select">
            {% for s in ['available','sold','reserved'] %}
            <option value="{{ s }}" {% if p.status==s %}selected{% endif %}>{{ s.capitalize() }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label d-flex justify-content-between">
            <span><i class="bi bi-text-paragraph me-1"></i>Description</span>
            <span class="form-text"><span id="descCount">{{ p.description|length }}</span>/2000</span>
          </label>
          <textarea name="description" id="descriptionField" class="form-control" rows="5" required maxlength="2000">{{ p.description }}</textarea>
        </div>
        <div class="col-12">
          <label class="form-label"><i class="bi bi-image me-1"></i>Replace Photo (optional)</label>
          {% if p.image %}
          <div class="mb-2"><img src="{{ product_image_url(p.image) }}" style="max-height:160px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);" alt="Current image"/></div>
          {% endif %}
          <div class="upload-zone" onclick="document.getElementById('imageInput').click()">
            <i class="bi bi-cloud-upload" style="font-size:1.5rem;color:var(--gold-400);display:block;margin-bottom:.3rem;"></i>
            <p style="color:var(--text-2);margin:0;font-size:.85rem;">Click to upload new image</p>
            <input type="file" name="image" id="imageInput" accept="image/*"/>
          </div>
          <img id="imagePreview" src="" alt="Preview" style="display:none;max-height:200px;border-radius:var(--radius-sm);margin-top:.8rem;border:1px solid var(--glass-border);"/>
        </div>
      </div>
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn btn-gold"><i class="bi bi-check-circle me-2"></i>Save Changes</button>
        <a href="{{ url_for('product_detail',pid=p.id) }}" class="btn btn-glass">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
