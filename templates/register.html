{% extends "base.html" %}{% block title %}Register — Majestic Market{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('index') }}" class="auth-logo">✦ MajesticMarket</a>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Join the marketplace — it's free</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required minlength="3" maxlength="30" autofocus/>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1"></i>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6"/>
        <div class="form-text mt-1"><i class="bi bi-info-circle me-1"></i>Minimum 6 characters</div>
      </div>
      <button type="submit" class="btn btn-gold w-100 mb-3"><i class="bi bi-person-check me-2"></i>Create Account</button>
    </form>
    <hr class="auth-divider"/>
    <p class="text-center" style="color:var(--text-3);font-size:.85rem;">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--gold-400);font-weight:600;">Sign in here</a></p>
  </div>
</div>
{% endblock %}
