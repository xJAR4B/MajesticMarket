{% extends "base.html" %}{% block title %}Login — Majestic Market{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('index') }}" class="auth-logo">✦ MajesticMarket</a>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to your account</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Your username" required autofocus/>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Your password" required/>
      </div>
      <button type="submit" class="btn btn-gold w-100 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    </form>
    <hr class="auth-divider"/>
    <p class="text-center" style="color:var(--text-3);font-size:.85rem;">Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--gold-400);font-weight:600;">Register here</a></p>
    <div class="glass-card p-3 mt-3" style="border-color:rgba(201,168,76,.12);">
      <p style="color:var(--text-muted);font-size:.75rem;text-align:center;margin:0;"><i class="bi bi-shield-check me-1" style="color:var(--gold-500)"></i>Demo admin: <strong style="color:var(--gold-400)">admin</strong> / <strong style="color:var(--gold-400)">admin123</strong></p>
    </div>
  </div>
</div>
{% endblock %}
